    }
    .field:focus-within { box-shadow: 0 0 10px rgba(34, 197, 94, 0.4) inset; }
    .field input { flex: 1; border: none; background: none; color: #fff; outline: none; font-size: 1rem; }
    .actions { display: flex; gap: 6px; }
    .btn {
        padding: 8px 12px; border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: pointer; font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn:hover { transform: scale(1.05); }
    .ghost { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .btn.send {
        background: linear-gradient(135deg, #facc15, #eab308); color: #0a0a12;
