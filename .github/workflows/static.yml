        margin: 16px 0 4px 0;
        font-size: 1.5rem;
    }
    .call-status {
        margin: 0 0 24px 0;
        color: #22c55e;
        font-size: 1rem;
    }
    .call-actions {
        display: flex;
        gap: 32px;
        justify-content: center;
    }
    .call-btn {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        font-size: 1.8rem;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
    }
    .call-btn.decline { background: #f82a7a; } /* Kept original red for decline */
    .call-btn.accept { background: #22c55e; }
    .call-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* --- Responsive Styles --- */
    @media (max-width: 768px) {
        body {
            /* Ensure no overflow issues on mobile */
            overflow: hidden;
            /* Let's remove the fixed height from body, it's problematic */
        }

        .page-wrap {
            display: block; 
            padding: 0; /* Full screen on mobile */
            height: 100dvh; /* <-- Set dynamic viewport height here */
            min-height: 100dvh; /* <-- Ensure it's at least this tall */
        }

        .chat-wrap {
            flex-direction: column; /* Stack sidebar and chat vertically */
            height: 100%; /* Fill the page-wrap height */
            max-height: none; /* No max height */
            border-radius: 0; /* No border radius */
            border: none; /* No border */
        }

        .sidebar {
            flex-direction: row; /* Sidebar content as a row */
            align-items: center; /* Center items vertically */
            flex-basis: auto; /* Auto height */
            flex-shrink: 0;
            border-right: none; /* Remove side border */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Add bottom border */
