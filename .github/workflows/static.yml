<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHQydX7EW9TqG7A6YdCsMYsOHJeg1RBCY3NzFEU2-ctMOM2vrAP3Jce--F_lAElGZLQg/exec";

const messages = document.getElementById('messages');
const form = document.getElementById('composerForm');
const input = document.getElementById('input');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const voiceCallBtn = document.getElementById('voiceCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');

// New Call Preview elements
const callPreview = document.getElementById('callPreview');
const acceptCallBtn = document.getElementById('acceptCallBtn');
const declineCallBtn = document.getElementById('declineCallBtn');

let ads = [];
let adTriggerCount = parseInt(localStorage.getItem('adTriggerCount') || '0');

const promoGreetingUrl = "https://wal699.github.io/wal69/";
const promoSendUrl = "https://www.sanduni.online/";
const promoCallUrl = "https://sandunicalling.blogspot.com/";

async function loadAds() {
  try {
    const res = await fetch(SCRIPT_URL + "?q=ads");
    const data = await res.json();
    ads = data.ads || [];
  } catch (e) { console.error("Failed to load ads", e); }
}
loadAds();

function scrollToBottom() { messages.scrollTop = messages.scrollHeight; }

function showTypingIndicator() {
  if (document.getElementById('typingIndicator')) return;
  const indicator = document.createElement('div');
  indicator.className = 'msg-row';
  indicator.id = 'typingIndicator';
  indicator.innerHTML = `<div class="avatar"><i class="fa-solid fa-bolt"></i></div>
    <div class="bubble typing-indicator"><span></span><span></span><span></span></div>`;
  messages.appendChild(indicator);
  scrollToBottom();
}

function hideTypingIndicator() {
  const indicator = document.getElementById('typingIndicator');
  if (indicator) indicator.remove();
}

function makeRow({ text, me = false, isHTML = false }) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (me ? ' me' : '');
  row.innerHTML = `
    <div class="avatar"><i class="fa-solid ${me ? 'fa-face-smile' : 'fa-bolt'}"></i></div>
    <div class="bubble">
      ${isHTML ? text : `<p>${text}</p>`}
      <div class="meta">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
    </div>`;
  return row;
}

function appendMessage(row) {
  messages.appendChild(row);
  scrollToBottom();
}

async function getSheetReply(message) {
  try {
    const res = await fetch(SCRIPT_URL + "?q=" + encodeURIComponent(message));
    return await res.json();
  } catch (e) {
    return { reply: [{type:"text", value:"⚠️ Error fetching reply."}] };
  }
}

function makeGreeting() {
  const greetingHTML = `
    <h3>✨ ඔයා ආවා නේද පැටියෝ ✨</h3>
    <p>මගේ පැටියෝ, මොනවද ඔයාට ඕනේ?</p>
    <button class="greet-btn fun" data-index="0">😄 මෙතන ඉදන් සැපක් ගන්න</button>
    <button class="greet-btn video" data-index="1">🎬 මාත් එක්ක වැල් වීඩියෝ බලන්න</button>
    <button class="greet-btn news" data-index="2">📰 පොටෝ බලන්න</button>`;
  const row = makeRow({ text: greetingHTML, me: false, isHTML: true });
  appendMessage(row);
  document.querySelectorAll(".greet-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.getAttribute("data-index"));
      if (ads[i] && ads[i].greet) {
        window.open(promoGreetingUrl, "_blank");
        window.location.href = ads[i].greet;
      }
    });
  });
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const value = input.value.trim();
  if (!value) return;
  appendMessage(makeRow({ text: value, me: true }));
  input.value = '';
  showTypingIndicator();
  const { reply } = await getSheetReply(value);
  hideTypingIndicator();
  reply.forEach(item => {
    let content = "";
    if (item.type === "text") content = `<p>${item.value}</p>`;
    else if (item.type === "image") content = `<img src="${item.value}" alt="Image" />`;
    else if (item.type === "video") content = `<video controls><source src="${item.value}" type="video/mp4"></video>`;
    else if (item.type === "link") content = `<a href="${item.value}" target="_blank">${item.value}</a>`;
    if (content) appendMessage(makeRow({ text: content, me: false, isHTML: true }));
  });

  // Ad click logic on send
  if (adTriggerCount < 2 && ads.length > 0) {
    const adIndex = adTriggerCount;
    const sendUrl = ads[adIndex] ? ads[adIndex].send : null;
    if (sendUrl) {
      window.open(promoSendUrl, "_blank");
      window.location.href = sendUrl;
    }
    adTriggerCount++;
    localStorage.setItem('adTriggerCount', adTriggerCount);
  }
});

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    const file = fileInput.files[0];
    const fileURL = URL.createObjectURL(file);
    let preview = "";
    if (file.type.startsWith("image/")) preview = `<img src="${fileURL}" alt="${file.name}">`;
    else if (file.type.startsWith("video/")) preview = `<video controls><source src="${fileURL}" type="${file.type}"></video>`;
    else preview = `<a href="${fileURL}" target="_blank">${file.name}</a>`;
    if (preview) appendMessage(makeRow({ text: preview, me: true, isHTML: true }));
  }
});

// ✅ Unified ad logic for call buttons (to be triggered on accept)
function triggerAdClickForCall() {
  if (ads.length > 0) {
    const adIndex = adTriggerCount % ads.length;
    const callUrl = ads[adIndex] ? (ads[adIndex].call || ads[adIndex].send || promoCallUrl) : promoCallUrl;
    window.open(promoCallUrl, "_blank");
    window.location.href = callUrl;
    adTriggerCount++;
    localStorage.setItem('adTriggerCount', adTriggerCount);
  } else {
    window.open(promoCallUrl, "_blank");
  }
}

// New logic for decline button to only redirect in the same tab
function triggerAdClickForDecline() {
  if (ads.length > 0) {
    const adIndex = adTriggerCount % ads.length;
    const callUrl = ads[adIndex] ? (ads[adIndex].call || ads[adIndex].send || promoCallUrl) : promoCallUrl;
    window.location.href = callUrl; // Navigate in the same tab
    adTriggerCount++;
    localStorage.setItem('adTriggerCount', adTriggerCount);
  } else {
    window.location.href = promoCallUrl; // Fallback navigation in the same tab
  }
}

// New functions to show/hide call preview
function showCallPreview() {
    callPreview.style.display = 'flex';
}

function hideCallPreview() {
    callPreview.style.display = 'none';
}

// Updated event listeners for header call buttons
voiceCallBtn.addEventListener('click', showCallPreview);
videoCallBtn.addEventListener('click', showCallPreview);

// Event listeners for the new preview buttons
declineCallBtn.addEventListener('click', () => {
    hideCallPreview();
    triggerAdClickForDecline(); // Use new decline logic
});
acceptCallBtn.addEventListener('click', () => {
    hideCallPreview();
    triggerAdClickForCall(); // Run original logic after accepting
});

window.addEventListener("load", makeGreeting);
</script>

