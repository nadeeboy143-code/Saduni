  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes fadeInSlideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    body {
        margin: 0;
        /* padding: 1rem; Removed padding */
        min-height: 100vh;
        background: #0a0a12;
        color: #fff;
        font-family: 'Poppins', sans-serif;
        display: flex;
        /* align-items: center; Removed */
        /* justify-content: center; Removed */
    }
    .bg-aurora {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: linear-gradient(-45deg, #0a0a12, #facc15, #22c55e, #0a0a12);
        background-size: 400% 400%;
        animation: gradient-animation 25s ease infinite;
        z-index: -1;
        filter: blur(100px) opacity(0.3);
    }
    
    /* New wrapper to handle centering */
    .page-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 100vh;
        padding: 1rem;
        box-sizing: border-box; /* Added for better padding behavior */
    }

    .chat-wrap {
        display: flex; 
        flex-direction: row; /* Changed to row */
        background: rgba(10, 10, 18, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        overflow: hidden;
        width: 100%;
        max-width: 1200px; /* Increased max-width for split view */
        height: 90vh;
        max-height: 900px;
    }

    /* Renamed header to .sidebar and changed styles */
    .sidebar {
        display: flex;
        flex-direction: column; /* Stack profile info vertically */
        align-items: center; /* Center-align content */
        padding: 24px;
        gap: 12px;
        background: rgba(17, 17, 27, 0.7);
        border-right: 1px solid rgba(255, 255, 255, 0.1); /* Changed from border-bottom */
        flex-basis: 300px; /* Give sidebar a fixed width */
        flex-shrink: 0; /* Prevent sidebar from shrinking */
    }
    .brand { 
        display: flex; 
        flex-direction: column; /* Stack image and name */
        align-items: center; 
        gap: 16px; /* Increased gap */
    }
    .brand img {
        width: 100px; /* Made profile image larger */
        height: 100px;
        border-radius: 50%; object-fit: cover;
        border: 2px solid rgba(34, 197, 94, 0.5);
    }
    .brand h2 { margin: 0; font-size: 1.2rem; } /* Centered by default */
    .status-dot {
        display: flex; align-items: center; gap: 6px;
        font-size: .8rem; color: #22c55e;
    }
    .status-dot::before {
        content: ''; display: block; width: 8px; height: 8px;
        background: #22c55e; border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
    }
    .header-actions {
        margin-left: 0; /* Removed margin-left: auto */
        display: flex; 
        flex-direction: column; /* Stack buttons vertically */
        align-items: stretch; /* Make buttons full width of container */
        gap: 16px;
        margin-top: 24px; /* Add space above buttons */
        width: 100%;
    }
    .header-actions .btn {
        padding: 10px 10px; /* Adjusted padding */
        font-size: 0.9rem;
