    .btn.send:hover { box-shadow: 0 0 20px rgba(250, 204, 21, 0.7); }
    .greet-btn {
        display: inline-block; margin: 6px 4px; padding: 10px 16px;
        border-radius: 20px; border: none; cursor: pointer; font-weight: 600;
        color: #0a0a12; background: linear-gradient(135deg, #facc15, #eab308);
        transition: all .25s ease; font-size: 0.9rem;
    }
    .greet-btn:hover {
        transform: scale(1.05) rotate(-1deg);
        box-shadow: 0 4px 15px rgba(250, 204, 21, .4);
    }
    .greet-btn.fun { background: linear-gradient(135deg, #4ade80, #22c55e); color: #0a0a12; }
    .greet-btn.video { background: linear-gradient(135deg, #fde047, #facc15); color: #0a0a12; }
