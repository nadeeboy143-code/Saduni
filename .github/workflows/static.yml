        background: linear-gradient(135deg, #22c55e, #15803d);
    }
    .bubble {
        max-width: 75%; padding: 14px 18px; border-radius: 18px;
        background: rgba(17, 17, 27, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.12);
        word-break: break-word; line-height: 1.5; font-size: 0.95rem;
    }
    .msg-row.me .bubble { background: linear-gradient(180deg, rgba(34, 197, 94, 0.3), rgba(21, 128, 61, 0.25)); }
    .bubble img, .bubble video { max-width: 220px; border-radius: 12px; display: block; margin-top: 4px; }
    .bubble a { color: #facc15; text-decoration: none; }
    .bubble a:hover { text-decoration: underline; }
    .meta { font-size: .7rem; color: #aaa; margin-top: 4px; }
    .composer {
        padding: 10px; background: rgba(17, 17, 27, 0.7);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .row { display: flex; gap: 8px; }
    .field {
        flex: 1; display: flex; align-items: center; gap: 6px;
        background: rgba(255, 255, 255, 0.05);
