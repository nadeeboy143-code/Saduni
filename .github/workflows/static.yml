        }

        .brand {
            flex-direction: row; /* Brand items in a row */
            align-items: center;
            gap: 12px; /* Reduce gap */
            flex: 1; /* Allow brand to take up space */
            overflow: hidden; /* Prevent h2 from wrapping and breaking layout */
        }

        .brand img {
            width: 42px; /* Smaller profile image */
            height: 42px;
            flex-shrink: 0; /* Prevent image from shrinking */
        }
        
        .brand h2 {
            font-size: 1.1rem; /* Smaller font size */
            white-space: nowrap; /* Prevent name from wrapping */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-dot {
            display: none; /* Hide status dot on mobile to save space */
        }

        .header-actions {
            flex-direction: row; /* Buttons in a row */
            margin-top: 0; /* Remove top margin */
            width: auto; /* Auto width */
            gap: 10px; /* Reduce gap */
        }

        .header-actions .btn {
            padding: 8px 10px; /* Adjust button padding */
            font-size: 1.1rem; /* Make icons a bit bigger */
        }
        
        .header-actions .btn span {
             display: none; /* Hide button text, show only icon */
        }
        
        .composer {
            padding: 8px; /* Slightly reduce composer padding */
            /* --- Creative Fix Below --- */
            background: rgba(10, 10, 18, 0.9); /* Darker, less transparent */
            backdrop-filter: blur(15px); /* Stronger blur for a "glass" effect */
            /* Add a creative glow and separator */
            box-shadow: 0 -4px 25px rgba(34, 197, 94, 0.25); 
            border-top: 1px solid rgba(34, 197, 94, 0.4); /* Brighter border */
        }

        .messages {
            padding: 10px; /* Reduce message padding */
        }

        .bubble {
            padding: 12px 16px; /* Adjust bubble padding */
            font-size: 0.9rem; /* Slightly smaller text */
        }

        .greet-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
        }
    }
  </style>
